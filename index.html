<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e5a63">
<meta name="robots" content="noindex, nofollow">
<title>Farm LTF2 – Công vụ và thư viện văn bản</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <img src="icons/icon-192.png" alt="LITECH" class="logo">
  <div class="ttl">
    <strong>Farm LTF2</strong>
    <span id="sub">Việc và văn bản</span>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<button id="fab" class="fab" aria-label="Thêm việc">＋</button>

<nav class="tabs" aria-label="Chuyển mục">
  <button data-tab="viec" class="on"><span>✓</span>Việc</button>
  <button data-tab="congvu"><span>⇄</span>Công vụ</button>
  <button data-tab="thuvien"><span>▤</span>Thư viện</button>
  <button data-tab="tongquan"><span>◔</span>Tổng quan</button>
  <button data-tab="caidat"><span>⚙</span>Cài đặt</button>
</nav>

<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
</div>

<div id="viewer" class="viewer" hidden>
  <div class="vbar">
    <button id="vClose" class="vbtn" aria-label="Đóng">✕</button>
    <div id="vTitle" class="vtitle"></div>
    <button id="vPrint" class="vbtn" aria-label="In">In</button>
    <a id="vDl" class="vbtn" href="#" download>PDF</a>
    <a id="vTab" class="vbtn" href="#" target="_blank" rel="noopener" aria-label="Mở tab mới">↗</a>
  </div>
  <div id="vPages" class="vpages"></div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="js/app.js"></script>
</body>
</html>
