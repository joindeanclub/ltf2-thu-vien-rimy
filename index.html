<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e5a63">
<meta name="robots" content="noindex, nofollow">
<title>Farm LTF2 – Thư viện văn bản và công vụ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <button id="btnBack" class="back-btn" hidden aria-label="Quay lại"><span class="bi">‹</span><small>Quay lại</small></button>
  <img src="icons/icon-192.png" alt="LITECH" class="logo" id="logo">
  <div class="ttl">
    <strong>Farm LTF2</strong>
    <span id="sub">Thư viện văn bản</span>
  </div>
  <button id="btnTheme" class="icon-btn" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện">◐</button>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="Chuyển mục">
  <button data-tab="thuvien" class="on"><span>▤</span>Thư viện</button>
  <button data-tab="congvu"><span>⇄</span>Công vụ</button>
  <button data-tab="camnang"><span>📘</span>Cẩm nang</button>
</nav>

<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
</div>

<div id="viewer" class="viewer" hidden>
  <div class="vbar">
    <button id="vClose" class="vbtn vclose" aria-label="Đóng"><span class="bi">✕</span><small>Đóng</small></button>
    <div id="vTitle" class="vtitle"></div>
    <button id="vPrint" class="vbtn" aria-label="In">In</button>
    <a id="vDl" class="vbtn" href="#" download>PDF</a>
    <a id="vTab" class="vbtn" href="#" target="_blank" rel="noopener" aria-label="Mở tab mới">↗</a>
  </div>
  <div id="vPages" class="vpages"></div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="js/app.js"></script>
</body>
</html>
